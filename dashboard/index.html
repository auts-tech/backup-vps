<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutsPanel</title>
    <meta
      name="description"
      content="AutsPanel — free, open-source hosting control panel for your VPS"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  </head>
  <body>
    <!-- App root — login screen or app shell rendered here by app.js -->
    <div id="app-root">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: var(--bg-primary);
        "
      >
        <div class="spinner spinner-lg"></div>
      </div>
    </div>

    <!-- Vector Icons Library -->
    <script src="/js/icons.js"></script>

    <!-- Components -->
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/ui.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/job-console.js"></script>
    <script src="/js/components/code-editor.js"></script>
    <script src="/js/components/updater.js"></script>

    <!-- API Layer -->
    <script src="/js/api.js"></script>

    <!-- Pages -->
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/sites.js"></script>
    <script src="/js/pages/site-new.js"></script>
    <script src="/js/pages/site-detail.js"></script>
    <script src="/js/pages/ssl.js"></script>
    <script src="/js/pages/files.js"></script>
    <script src="/js/pages/databases.js"></script>
    <script src="/js/pages/php.js"></script>
    <script src="/js/pages/mail.js"></script>
    <script src="/js/pages/terminal.js"></script>
    <script src="/js/pages/ports.js"></script>
    <script src="/js/pages/backups.js"></script>
    <script src="/js/pages/cron.js"></script>
    <script src="/js/pages/monitor.js"></script>
    <script src="/js/pages/logs.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/pages/firewall.js"></script>
    <script src="/js/pages/ssh-keys.js"></script>
    <script src="/js/pages/services.js"></script>

    <!-- Main App Controller (must load last) -->
    <script src="/js/app.js"></script>
  </body>
</html>
